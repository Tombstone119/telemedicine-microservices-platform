server {
    listen 80;
    resolver 127.0.0.11 ipv6=off valid=10s;
    
    # Health check
    location /health {
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }
    
    # Auth Service
    location /api/auth/ {
        set $auth_upstream http://auth-service:3000;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # Patient Service
    location /api/patients/ {
        set $patient_upstream http://patient-service:3001;
        proxy_pass $patient_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # Doctor Service
    location /api/doctors/ {
        set $doctor_upstream http://doctor-service:3002;
        proxy_pass $doctor_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # Appointment Service
    location /api/appointments/ {
        set $appointment_upstream http://appointment-service:3003;
        proxy_pass $appointment_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # Telemedicine Service
    location /api/telemedicine/ {
        set $telemedicine_upstream http://telemedicine-service:3004;
        proxy_pass $telemedicine_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # Payment Service
    location /api/payments/ {
        set $payment_upstream http://payment-service:3005;
        proxy_pass $payment_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # Notification Service
    location /api/notifications/ {
        set $notification_upstream http://notification-service:3006;
        proxy_pass $notification_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }
    
    # AI Symptom Service
    location /api/ai-symptom/ {
        set $ai_symptom_upstream http://ai-symptom-service:3007;
        proxy_pass $ai_symptom_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }
}
