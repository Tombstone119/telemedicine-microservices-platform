services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - appointment-service
      - telemedicine-service
      - payment-service
      - notification-service
      - ai-symptom-service

  auth-service:
    build: ./services/auth-service
    env_file: ./services/auth-service/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  patient-service:
    build:
      context: .
      dockerfile: services/patient-service/Dockerfile
    env_file: ./services/patient-service/.env
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - mongo

  doctor-service:
    build:
      context: .
      dockerfile: services/doctor-service/Dockerfile
    env_file: ./services/doctor-service/.env
    ports:
      - "3002:3002"
    depends_on:
      - postgres

  appointment-service:
    build:
      context: .
      dockerfile: services/appointment-service/Dockerfile
    env_file: ./services/appointment-service/.env
    ports:
      - "3003:3003"
    depends_on:
      - postgres
      - rabbitmq

  telemedicine-service:
    build:
      context: .
      dockerfile: services/telemedicine-service/Dockerfile
    env_file: ./services/telemedicine-service/.env
    ports:
      - "3004:3004"
    depends_on:
      - postgres

  jitsi-web:
    image: jitsi/web:stable
    ports:
      - "8000:80"
      - "8443:443"
    environment:
      - ENABLE_AUTH=1
      - ENABLE_GUESTS=1
      - AUTH_TYPE=internal
      - PUBLIC_URL=http://localhost:8000
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - JICOFO_AUTH_USER=focus
      - JVB_AUTH_USER=jvb
      - JVB_BREWERY_MUC=jvbbrewery
      - JIBRI_BREWERY_MUC=jibribrewery
      - JIGASI_BREWERY_MUC=jigasibrewery
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    volumes:
      - jitsi_web_config:/config

  jitsi-prosody:
    image: jitsi/prosody:stable
    expose:
      - "5222"
      - "5280"
      - "5347"
    environment:
      - ENABLE_AUTH=1
      - ENABLE_GUESTS=1
      - AUTH_TYPE=internal
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_COMPONENT_SECRET=jicofo_component_secret
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=focus_password
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jvb_password
    volumes:
      - jitsi_prosody_config:/config
      - jitsi_prosody_plugins:/prosody-plugins-custom

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    depends_on:
      - jitsi-prosody
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JICOFO_COMPONENT_SECRET=jicofo_component_secret
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=focus_password
      - JVB_BREWERY_MUC=jvbbrewery
    volumes:
      - jitsi_jicofo_config:/config

  jitsi-jvb:
    image: jitsi/jvb:stable
    depends_on:
      - jitsi-prosody
    ports:
      - "10000:10000/udp"
      - "127.0.0.1:9090:9090"
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jvb_password
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_DISABLED=true
      - JVB_STUN_SERVERS=meet-jit-si-turnrelay.jitsi.net:443
      - JVB_ADVERTISE_IPS=127.0.0.1
    volumes:
      - jitsi_jvb_config:/config

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    env_file: ./services/payment-service/.env
    ports:
      - "3005:3005"
    depends_on:
      - postgres
      - rabbitmq

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file: ./services/notification-service/.env
    ports:
      - "3006:3006"
    depends_on:
      - rabbitmq

  ai-symptom-service:
    build:
      context: .
      dockerfile: services/ai-symptom-service/Dockerfile
    env_file: ./services/ai-symptom-service/.env
    ports:
      - "3007:3007"
    depends_on:
      - postgres
      - ollama
      - whisper
      - tts
      - livekit

  # ========== AI MODEL SERVICES ==========
  
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  whisper:
    image: hwdsl2/whisper-server:latest
    ports:
      - "9001:9000"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_LANGUAGE=en
    volumes:
      - whisper_data:/var/lib/whisper
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  tts:
    build:
      context: .
      dockerfile: services/tts-service/Dockerfile
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"   # WebSocket for WebRTC
      - "7881:7881"   # HTTP API
    environment:
      - LIVEKIT_API_KEY=telemedicine_key
      - LIVEKIT_API_SECRET=telemedicine_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7881/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  ollama_data:
  whisper_data:
  jitsi_web_config:
  jitsi_prosody_config:
  jitsi_prosody_plugins:
  jitsi_jicofo_config:
  jitsi_jvb_config: