apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: telemedicine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done"]
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 3; done"]
        - name: wait-for-auth
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z auth-service 3000; do echo waiting for auth-service; sleep 3; done"]
      containers:
        - name: payment-service
          image: telemedicine-microservices-platform-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: JWT_SECRET
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: DB_NAME
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: RABBITMQ_URL
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: RABBITMQ_EXCHANGE
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_CURRENCY
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: STRIPE_CURRENCY
            - name: FRONTEND_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: FRONTEND_BASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: telemedicine
spec:
  selector:
    app: payment-service
  ports:
    - port: 3005
      targetPort: 3005
