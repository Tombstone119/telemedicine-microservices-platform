apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: telemedicine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done"]
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 3; done"]
        - name: wait-for-auth
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z auth-service 3000; do echo waiting for auth-service; sleep 3; done"]
        - name: wait-for-doctor
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z doctor-service 3002; do echo waiting for doctor-service; sleep 3; done"]
      containers:
        - name: appointment-service
          image: telemedicine-microservices-platform-appointment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: JWT_SECRET
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: DB_NAME
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: RABBITMQ_URL
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: RABBITMQ_EXCHANGE
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: telemedicine
spec:
  selector:
    app: appointment-service
  ports:
    - port: 3003
      targetPort: 3003
