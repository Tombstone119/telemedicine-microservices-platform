apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: telemedicine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 3; done"]
      containers:
        - name: notification-service
          image: telemedicine-microservices-platform-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: RABBITMQ_URL
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: RABBITMQ_EXCHANGE
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: RABBITMQ_QUEUE
            - name: NOTIFICATION_MODE
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: NOTIFICATION_MODE
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: SENDGRID_API_KEY
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: telemedicine-config
                  key: SENDGRID_FROM_EMAIL
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: TWILIO_PHONE_NUMBER
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: telemedicine
spec:
  selector:
    app: notification-service
  ports:
    - port: 3006
      targetPort: 3006
