# Runs the seed script once after all services are up.
# Re-run manually with: kubectl delete job seeder -n telemedicine && kubectl apply -f k8s/jobs/seeder-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: seeder
  namespace: telemedicine
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-gateway
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z gateway 80; do echo waiting for gateway; sleep 5; done"]
      containers:
        - name: seeder
          image: telemedicine-microservices-platform-seeder:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BASE_URL
              value: "http://gateway"
            - name: MAX_WAIT
              value: "120"
