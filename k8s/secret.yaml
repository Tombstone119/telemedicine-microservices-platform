# Replace all values with your actual secrets before applying.
# Values here use stringData so no base64 encoding is needed.
apiVersion: v1
kind: Secret
metadata:
  name: telemedicine-secrets
  namespace: telemedicine
type: Opaque
stringData:
  JWT_SECRET: "replace_with_a_long_random_secret_min_32_chars"
  DB_PASSWORD: "secret"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  STRIPE_SECRET_KEY: "sk_test_replace_with_your_stripe_key"
  STRIPE_WEBHOOK_SECRET: "whsec_replace_with_your_webhook_secret"
  SENDGRID_API_KEY: "SG.replace_with_your_sendgrid_key"
  TWILIO_ACCOUNT_SID: "ACxxxxxx"
  TWILIO_AUTH_TOKEN: "replace_with_twilio_auth_token"
  TWILIO_PHONE_NUMBER: "+1xxxxxxxxxx"
  LIVEKIT_API_KEY: "telemedicine_key"
  LIVEKIT_API_SECRET: "telemedicine_secret"
