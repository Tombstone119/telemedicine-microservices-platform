apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: telemedicine
data:
  default.conf: |
    server {
        listen 80;

        location /health {
            return 200 "Gateway OK\n";
            add_header Content-Type text/plain;
        }

        location /api/auth/ {
            proxy_pass http://auth-service:3000/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/patients/ {
            proxy_pass http://patient-service:3001/api/patients/;
            proxy_set_header Host $host;
        }

        location /api/doctors/ {
            proxy_pass http://doctor-service:3002/api/doctors/;
            proxy_set_header Host $host;
        }

        location /api/appointments/ {
            proxy_pass http://appointment-service:3003/api/appointments/;
            proxy_set_header Host $host;
        }

        location /api/telemedicine/ {
            proxy_pass http://telemedicine-service:3004/api/telemedicine/;
            proxy_set_header Host $host;
        }

        location /api/payments/ {
            proxy_pass http://payment-service:3005/api/payments/;
            proxy_set_header Host $host;
        }

        location /api/notifications/ {
            proxy_pass http://notification-service:3006/api/notifications/;
            proxy_set_header Host $host;
        }

        location /api/ai-symptom/ {
            proxy_pass http://ai-symptom-service:3007/api/ai-symptom/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: telemedicine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
# NodePort for local cluster access (minikube / kind).
# For cloud deployments, change type to LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: telemedicine
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
