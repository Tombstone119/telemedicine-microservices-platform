apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: telemedicine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7880
            - containerPort: 7881
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: telemedicine-secrets
                  key: LIVEKIT_API_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: telemedicine
spec:
  selector:
    app: livekit
  ports:
    - name: ws
      port: 7880
      targetPort: 7880
    - name: http
      port: 7881
      targetPort: 7881
