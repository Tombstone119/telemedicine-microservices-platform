apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
    app.kubernetes.io/part-of: telemedicine-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: your-dockerhub-username/payment-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3005
        env:
        - name: PORT
          value: "3005"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: member3-services-config
              key: NODE_ENV
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: member3-services-secrets
              key: JWT_SECRET
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: member3-services-secrets
              key: DATABASE_URL_PAYMENT
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: member3-services-config
              key: RABBITMQ_URL
        - name: APPOINTMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: member3-services-config
              key: APPOINTMENT_SERVICE_URL
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: member3-services-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: member3-services-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: PAYMENT_SUCCESS_URL
          valueFrom:
            configMapKeyRef:
              name: member3-services-config
              key: PAYMENT_SUCCESS_URL
        - name: PAYMENT_CANCEL_URL
          valueFrom:
            configMapKeyRef:
              name: member3-services-config
              key: PAYMENT_CANCEL_URL
        - name: TAX_RATE
          valueFrom:
            configMapKeyRef:
              name: member3-services-config
              key: TAX_RATE
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "750m"
            memory: "768Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 25
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 12
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - name: http
    port: 3005
    targetPort: 3005
  type: ClusterIP
